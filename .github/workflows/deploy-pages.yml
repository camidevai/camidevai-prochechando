name: Deploy Prochechando to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the React application
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Prepare static hosting and client-side routes
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
