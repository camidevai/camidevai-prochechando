name: Deploy Prochechando to GitHub Pages

on:
  push:
    branches: [prochechando.ai]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the React application
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Identificador público confirmado para este formulario. Evita valores antiguos en variables de Actions.
          VITE_EMAILJS_SERVICE_ID: 'service_ez94wzj'
          # La plantilla y la Public Key pueden sobrescribirse desde GitHub Actions.
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Prepare static hosting and client-side routes
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          mkdir -p dist/apob
          cp dist/index.html dist/apob/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

      # The repository also has legacy branch publishing enabled. Publish the
      # compiled app after that build so raw JSX can never replace the live app.
      - name: Wait for legacy branch deployment
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 40; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 30
              });
              const legacy = data.workflow_runs.find(run => run.name === 'pages build and deployment');
              if (legacy?.status === 'completed') return;
              if (!legacy && attempt >= 5) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Legacy Pages deployment did not finish before publishing the compiled app.');

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
